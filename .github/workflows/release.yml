name: 发布

# 每次 push 到 main 就出包并发布，GitHub 与 GitCode 同时挂发行版。
#
# 不再需要「改 VERSION → 打 tag → 推 → 等」这套手工流程：
# 构建号取 git 提交数，自动拼成 1.1.23 这种形式，tag 也由本工作流自动打。
# 想开新的大版本时，才去 build.py 里改 VERSION 那一行。
#
# 推 tag 也能触发，用于补发某个版本；手动触发同理。
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# 连推两下时取消上一次构建，只发最新的那一份，免得建出重复发行版。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write     # 建 GitHub Release、推 tag 需要

jobs:
  release:
    # 用原生 Windows 跑 BCS_TXT.exe（32 位 Delphi 程序）。
    # 不用 ubuntu+wine 是因为 Delphi VCL 的字体/编码在 wine 上偶有差异，
    # 打包结果的字节可能与本地不一致——这个项目对字节敏感，不值得赌。
    runs-on: windows-latest
    env:
      # Windows runner 的默认控制台编码是 cp1252，build.py 一 print 中文就
      # UnicodeEncodeError（实测 line 263）。强制 UTF-8 输出。
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # 要算 rev-list --count，浅克隆只有 1 个提交

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 算出本次版本号
        id: vars
        shell: bash
        run: |
          set -eu
          BASE=$(grep -oP "^VERSION = '\K[^']+" build.py)
          N=$(git rev-list --count HEAD)
          VER="$BASE.$N"                    # 1.1 + 第15个提交 -> 1.1.15
          TAG="v$VER"
          echo "base=$BASE"     >> "$GITHUB_OUTPUT"
          echo "ver=$VER"       >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"       >> "$GITHUB_OUTPUT"
          echo "== 主版本 $BASE / 第 $N 个提交 -> $TAG"

          # 本次提交如果只是改文档/CI，不出包。
          # 判断依据：除了 md/txt 说明和 .github/ 以外，有没有实质文件变动。
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD | grep -vE '^(\.github/|.*\.md$|GITHUB_CI_配置指南\.txt$)' || true)
            if [ -z "$CHANGED" ]; then
              echo "publish=no" >> "$GITHUB_OUTPUT"
              echo "::notice::本次只动了说明/CI，跳过出包"
              exit 0
            fi
            echo "实质改动："; echo "$CHANGED"
          fi
          echo "publish=yes" >> "$GITHUB_OUTPUT"

      - name: 构建并出包
        if: steps.vars.outputs.publish == 'yes'
        shell: bash
        env:
          DR2_VERSION: ${{ steps.vars.outputs.ver }}
        run: |
          set -eu
          python build.py
          echo "=== build/ ==="
          ls -la build/
          ZIP=$(ls build/*.zip | head -1)
          echo "产包 $ZIP  $(stat -c %s "$ZIP") 字节"

          # 关键校验：zip 里必须带 data/frontend/ 路径，否则解压到根目录装不上
          python - <<'PY'
          import sys, zipfile, glob
          z = zipfile.ZipFile(glob.glob('build/*.zip')[0])
          names = z.namelist()
          print('zip 内容:', names)
          if 'data/frontend/str_en.bcs' not in names:
              sys.exit('::error::zip 缺 data/frontend/str_en.bcs，解压后装不上')
          PY

      - name: 生成发行说明
        if: steps.vars.outputs.publish == 'yes'
        id: notes
        shell: bash
        run: |
          set -eu
          python .github/scripts/gc_notes.py \
            --tag "${{ steps.vars.outputs.tag }}" \
            --txt 新的汉化补丁.txt \
            --out notes.md
          echo "--- 预览 ---"
          cat notes.md

      - uses: actions/upload-artifact@v4
        if: steps.vars.outputs.publish == 'yes'
        with:
          name: release-pkg
          path: build/*.zip

      # ------------------------------------------------ GitHub Release
      # 不用 softprops/action-gh-release：它上传附件时中文文件名会被截断
      # （丧尸围城2…-v1.1.zip -> 2.Plus-.-v1.1.zip），改用脚本显式带 name。
      - name: 建 GitHub 发行版
        if: steps.vars.outputs.publish == 'yes'
        shell: bash
        env:
          GH_TOKEN_RLS: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -eu
          ZIP=$(ls build/*.zip | head -1)
          python .github/scripts/gh_release.py \
            --token "$GH_TOKEN_RLS" --tag "$TAG" --zip "$ZIP" \
            --body-file notes.md --name "汉化补丁 $TAG"

      # ------------------------------------------------ GitCode Release
      # GitCode 的 token 走 query 参数 ?access_token=，不接受 Authorization 头
      - name: 建 GitCode 发行版
        if: steps.vars.outputs.publish == 'yes'
        shell: bash
        env:
          GC: ${{ secrets.GITCODE_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -eu
          if [ -z "${GC:-}" ]; then
            echo "::error::缺 Secret GITCODE_TOKEN"
            exit 1
          fi
          ZIP=$(ls build/*.zip | head -1)
          python .github/scripts/gc_release.py \
            --token "$GC" --tag "$TAG" --zip "$ZIP" --body-file notes.md

      # 打完 tag 放在最后：前面失败就不会留下指向半成品的 tag。
      # 用 GITHUB_TOKEN 推的 tag 不会再次触发工作流（GitHub 的规则），不会死循环。
      - name: 打版本 tag
        if: steps.vars.outputs.publish == 'yes'
        shell: bash
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -eu
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "refs/tags/$TAG"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output
          path: build/
          if-no-files-found: ignore
